[tool.poetry]
name = "instastatus-analyzer"
version = "1.0.0"
description = "Comprehensive Instagram account intelligence & bot detection platform"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/InstaStatus-Analyzer"
repository = "https://github.com/yourusername/InstaStatus-Analyzer"
keywords = ["instagram", "analytics", "bot-detection", "social-media", "intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
instagrapi = "^2.1.2"
scikit-learn = "^1.4.0"
numpy = "^1.26.4"
pandas = "^2.2.0"
typer = {extras = ["all"], version = "^0.12.3"}
rich = "^13.7.0"
streamlit = "^1.32.0"
plotly = "^5.20.0"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.1"}
pydantic = "^2.6.3"
pydantic-settings = "^2.2.1"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
tenacity = "^8.2.3"
loguru = "^0.7.2"
reportlab = "^4.1.0"
fpdf2 = "^2.7.9"
transformers = "^4.38.0"
torch = "^2.2.0"
selenium = "^4.18.1"
undetected-chromedriver = "^3.5.5"
arrow = "^1.3.0"
tqdm = "^4.66.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.3.4"
black = "^24.3.0"
mypy = "^1.9.0"

[tool.poetry.scripts]
instaanalyzer = "src.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
